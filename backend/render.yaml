# Deploy backend on Render: Dashboard → New → Blueprint → connect this repo
# Or create a Web Service with Root Directory = backend
services:
  - type: web
    name: vital-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false

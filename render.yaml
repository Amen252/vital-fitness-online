# Render Blueprint — connect repo https://github.com/Amen252/Vital-online-app
# Dashboard → New → Blueprint → select this repo
services:
  - type: web
    name: vital-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: ALLOW_RENDER_ORIGINS
        value: "true"
